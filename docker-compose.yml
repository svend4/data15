version: '3.8'
services:
  orchestrator:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

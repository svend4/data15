# Hybrid Orchestrator v5.0 - Docker Compose
version: '3.8'

services:
  orchestrator:
    build: .
    container_name: hybrid-orchestrator
    ports:
      - "5000:5000"  # REST API
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./tasks:/app/tasks
      - ./logs:/app/logs
      - ./state:/app/state
      - ./cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

